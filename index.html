<title>Alphabet</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Dark background matching bgCol (#020701) so there's no white flash
     while p5 boots and initTheme() hasn't painted the canvas yet. Canvas
     fills the viewport with no margins/scrollbars - desktop only, per the
     port's scope (no mobile layout, no touch handling). */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #020701;
    overflow: hidden;
  }
  canvas {
    display: block;
  }

  /* Click-to-start overlay. Browsers block AudioContext until a user
     gesture, so nothing may be heard before this is dismissed. Solid
     background matches the page so dismissing it never flashes. */
  #startOverlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020701;
    color: #f5f5f0;
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.4s ease;
  }
  #startOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #startOverlay .prompt {
    max-width: 32em;
    padding: 0 1.5em;
    line-height: 1.6;
  }
  #startOverlay .headline {
    font-size: 1.6em;
    margin: 0 0 0.5em;
  }
  #startOverlay .detail {
    font-size: 1em;
    opacity: 0.8;
    margin: 0;
  }
</style>

<div id="startOverlay">
  <div class="prompt">
    <p class="headline">Just start typing.</p>
    <p class="detail">
      Type a crayon color or an emoji keyword and press Enter to see what
      happens. Up/down arrows scroll through colors, left/right arrows
      scroll through creatures (and everything else). Click, or press any
      key, to begin.
    </p>
  </div>
</div>

<!--
  p5.js pinned to 1.11.3 (1.x global-mode API, not 2.x) from the CDN per
  the port's "no build step" rule, then every js/*.js file as a plain
  classic <script> in dependency order. Each file's top-level let/const
  land in one shared global scope - exactly like Processing's tab
  concatenation - so a file that reads another's global at load time
  (e.g. bgTarget/bgCurrent reading bgCol in theme.js) needs that global's
  file to have already run. config.js and the pure-data files
  (palette.js, keywords.js) load first for that reason; sketch.js, which
  defines setup()/draw()/keyPressed() and calls into every other file,
  loads last.
-->
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
<script src="js/config.js"></script>
<script src="js/palette.js"></script>
<script src="js/keywords.js"></script>
<script src="js/theme.js"></script>
<script src="js/matching.js"></script>
<script src="js/char.js"></script>
<script src="js/typingBuffer.js"></script>
<script src="js/emojiGrid.js"></script>
<script src="js/sound.js"></script>
<script src="js/sketch.js"></script>

<script>
  // Dismiss the click-to-start overlay on the first click or keydown, and
  // start audio right then - that user gesture is the only chance
  // startAudio() (sound.js) gets to create/resume the AudioContext.
  // Deliberately does not call preventDefault()/stopPropagation(): a
  // dismissing keydown should still reach p5's own keyPressed handler, so
  // the very first key someone presses both starts audio and types.
  (function () {
    const overlay = document.getElementById( 'startOverlay');
    let started = false;

    function dismiss() {
      if ( started) return;
      started = true;
      startAudio();
      overlay.classList.add( 'hidden');
      overlay.removeEventListener( 'click', dismiss);
      window.removeEventListener( 'keydown', dismiss);
    }

    overlay.addEventListener( 'click', dismiss);
    window.addEventListener( 'keydown', dismiss);
  })();
</script>
